name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification gate
        run: pnpm verify

      - name: Stage Linux MCPB
        run: pnpm build:mcpb:stage

      - name: Run staged Linux MCPB integration tests
        env:
          RELAY_RUN_MCPB_STAGE_TESTS: '1'
        run: pnpm exec vitest run tests/integration/mcpb-stage.test.ts

      - name: Validate staged Linux MCPB
        run: pnpm validate:mcpb

      - name: Verify staged Linux MCPB runtime
        run: pnpm verify:mcpb:stage

      - name: Pack and inspect Linux MCPB
        run: pnpm pack:mcpb
